<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<meta name="theme-color" content="#0f0f0f">
<title>Семейный бюджет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #242424;
  --border: #2e2e2e;
  --text: #f0f0f0;
  --muted: #888;
  --faint: #444;
  --green: #4ade80;
  --green-dim: #1a3d28;
  --red: #f87171;
  --red-dim: #3d1a1a;
  --amber: #fbbf24;
  --amber-dim: #3d2e0a;
  --blue: #60a5fa;
  --blue-dim: #0f2540;
  --pink: #f472b6;
  --pink-dim: #3d1130;
  --accent: #4ade80;
  --radius: 16px;
  --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  overscroll-behavior: none;
}

/* Layout */
.app {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}

/* Status bar area */
.status-bar {
  height: calc(var(--safe-top) + 0px);
  background: var(--bg);
  flex-shrink: 0;
}

/* Header */
.header {
  flex-shrink: 0;
  padding: 20px 20px 0;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.app-title { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
.sync-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
  background: var(--surface);
  padding: 5px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
}
.sync-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  transition: background 0.3s;
}
.sync-dot.syncing { background: var(--amber); animation: pulse 1s infinite; }
.sync-dot.error { background: var(--red); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

/* Budget overview */
.overview {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}
.budget-main {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
}
.budget-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 400; }
.budget-amount { font-size: 32px; font-weight: 600; letter-spacing: -1px; font-family: 'DM Mono', monospace; }
.budget-amount.safe { color: var(--green); }
.budget-amount.warn { color: var(--amber); }
.budget-amount.danger { color: var(--red); }
.budget-right { text-align: right; }
.budget-spent { font-size: 20px; font-weight: 500; font-family: 'DM Mono', monospace; color: var(--muted); }
.progress-track {
  height: 4px;
  background: var(--surface2);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 12px;
}
.progress-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.4s ease, background 0.4s ease;
}
.budget-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
}
.stat { }
.stat-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.stat-val { font-size: 14px; font-weight: 500; font-family: 'DM Mono', monospace; }

/* Scrollable area */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 20px;
  -webkit-overflow-scrolling: touch;
}

/* Add expense */
.add-form {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
}
.form-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}
.inp {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  padding: 10px 12px;
  outline: none;
  width: 100%;
  -webkit-appearance: none;
  transition: border-color 0.2s;
}
.inp:focus { border-color: var(--accent); }
.inp::placeholder { color: var(--faint); }
.inp-amount { width: 120px; flex-shrink: 0; font-family: 'DM Mono', monospace; }
.who-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.who-btn {
  padding: 9px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  -webkit-appearance: none;
}
.who-btn.active-enver { background: var(--blue-dim); border-color: var(--blue); color: var(--blue); }
.who-btn.active-wife { background: var(--pink-dim); border-color: var(--pink); color: var(--pink); }
.who-btn.active-both { background: var(--green-dim); border-color: var(--green); color: var(--green); }
.btn-submit {
  width: 100%;
  background: var(--accent);
  color: #0f0f0f;
  border: none;
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 600;
  padding: 12px;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  -webkit-appearance: none;
}
.btn-submit:active { transform: scale(0.98); opacity: 0.85; }

/* Expense list */
.list-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.list-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.filter-tabs {
  display: flex;
  gap: 6px;
}
.filter-tab {
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  -webkit-appearance: none;
  transition: all 0.15s;
}
.filter-tab.active { background: var(--surface2); color: var(--text); border-color: var(--faint); }

.expense-list { display: flex; flex-direction: column; gap: 8px; padding-bottom: 20px; }
.expense-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  animation: slideIn 0.2s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.exp-who-dot {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600;
  flex-shrink: 0;
}
.dot-enver { background: var(--blue-dim); color: var(--blue); }
.dot-wife { background: var(--pink-dim); color: var(--pink); }
.dot-both { background: var(--green-dim); color: var(--green); }
.exp-info { flex: 1; min-width: 0; }
.exp-desc { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.exp-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.exp-amount { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; color: var(--red); flex-shrink: 0; }
.btn-del {
  background: none; border: none; color: var(--faint);
  font-size: 20px; cursor: pointer; padding: 0 0 0 8px;
  line-height: 1; flex-shrink: 0;
  transition: color 0.15s;
}
.btn-del:active { color: var(--red); }
.empty-state {
  text-align: center;
  padding: 32px 20px;
  color: var(--muted);
  font-size: 14px;
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="app-title">Семейный бюджет</div>
      <div class="sync-badge">
        <div class="sync-dot" id="sync-dot"></div>
        <span id="sync-label">Синк</span>
      </div>
    </div>

    <div class="overview">
      <div class="budget-main">
        <div>
          <div class="budget-label">Осталось в этом месяце</div>
          <div class="budget-amount safe" id="left-amt">€1 905</div>
        </div>
        <div class="budget-right">
          <div class="budget-label">Потрачено</div>
          <div class="budget-spent" id="spent-amt">€0</div>
        </div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress" style="width:0%;background:var(--green)"></div>
      </div>
      <div class="budget-stats">
        <div class="stat">
          <div class="stat-label">в день</div>
          <div class="stat-val" id="day-amt">€63</div>
        </div>
        <div class="stat">
          <div class="stat-label">в неделю</div>
          <div class="stat-val" id="week-amt">€476</div>
        </div>
        <div class="stat">
          <div class="stat-label">% бюджета</div>
          <div class="stat-val" id="pct-amt">0%</div>
        </div>
      </div>
    </div>
  </div>

  <div class="scroll-area">
    <div class="add-form">
      <div class="form-title">Новый расход</div>
      <div class="input-row">
        <input class="inp" type="text" id="inp-desc" placeholder="Продукты, кафе, бензин…">
        <input class="inp inp-amount" type="number" id="inp-amt" placeholder="€0" min="0" step="0.01" inputmode="decimal">
      </div>
      <div class="who-row">
        <button class="who-btn active-enver" id="who-enver" onclick="selectWho('enver')">Enver</button>
        <button class="who-btn" id="who-wife" onclick="selectWho('wife')">Жена</button>
        <button class="who-btn" id="who-both" onclick="selectWho('both')">Оба</button>
      </div>
      <button class="btn-submit" onclick="addExpense()">Добавить расход</button>
    </div>

    <div class="list-header">
      <div class="list-title">Расходы</div>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="setFilter('all',this)">Все</button>
        <button class="filter-tab" onclick="setFilter('enver',this)">Enver</button>
        <button class="filter-tab" onclick="setFilter('wife',this)">Жена</button>
      </div>
    </div>
    <div class="expense-list" id="expense-list"></div>
  </div>
</div>

<script>
const BUDGET = 1905;
let expenses = [];
let selectedWho = 'enver';
let currentFilter = 'all';
let syncInterval;

const STORAGE_KEY = 'fam_budget_v1';

function selectWho(who) {
  selectedWho = who;
  document.getElementById('who-enver').className = 'who-btn' + (who === 'enver' ? ' active-enver' : '');
  document.getElementById('who-wife').className = 'who-btn' + (who === 'wife' ? ' active-wife' : '');
  document.getElementById('who-both').className = 'who-btn' + (who === 'both' ? ' active-both' : '');
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

function fmt(n) {
  return '€' + Math.abs(n).toLocaleString('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function fmtDate(ts) {
  const d = new Date(ts);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  if (isToday) return 'Сегодня, ' + time;
  return d.toLocaleDateString('ru-RU', { day: '2-digit', month: 'short' }) + ' ' + time;
}

function updateOverview() {
  const totalSpent = expenses.reduce((s, e) => s + e.amount, 0);
  const left = BUDGET - totalSpent;
  const pct = Math.min(100, (totalSpent / BUDGET) * 100);
  const daysLeft = Math.max(1, 30);
  const dayLeft = left / daysLeft;
  const weekLeft = dayLeft * 7;

  const leftEl = document.getElementById('left-amt');
  leftEl.textContent = fmt(left);
  leftEl.className = 'budget-amount ' + (pct < 60 ? 'safe' : pct < 85 ? 'warn' : 'danger');

  document.getElementById('spent-amt').textContent = fmt(totalSpent);
  document.getElementById('pct-amt').textContent = Math.round(pct) + '%';
  document.getElementById('day-amt').textContent = fmt(Math.max(0, dayLeft));
  document.getElementById('week-amt').textContent = fmt(Math.max(0, weekLeft));

  const prog = document.getElementById('progress');
  prog.style.width = pct + '%';
  prog.style.background = pct < 60 ? 'var(--green)' : pct < 85 ? 'var(--amber)' : 'var(--red)';
}

function renderList() {
  const filtered = currentFilter === 'all' ? expenses : expenses.filter(e => e.who === currentFilter);
  const list = document.getElementById('expense-list');
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state">Расходов пока нет</div>';
    return;
  }
  const whoLabel = { enver: 'E', wife: 'Ж', both: '⁕' };
  const dotClass = { enver: 'dot-enver', wife: 'dot-wife', both: 'dot-both' };
  list.innerHTML = [...filtered].reverse().map(e => `
    <div class="expense-item" id="exp-${e.id}">
      <div class="exp-who-dot ${dotClass[e.who]}">${whoLabel[e.who]}</div>
      <div class="exp-info">
        <div class="exp-desc">${e.desc}</div>
        <div class="exp-meta">${fmtDate(e.ts)}</div>
      </div>
      <div class="exp-amount">-${fmt(e.amount)}</div>
      <button class="btn-del" onclick="deleteExpense('${e.id}')">×</button>
    </div>
  `).join('');
}

function addExpense() {
  const desc = document.getElementById('inp-desc').value.trim();
  const amt = parseFloat(document.getElementById('inp-amt').value);
  if (!desc || isNaN(amt) || amt <= 0) {
    document.getElementById(desc ? 'inp-amt' : 'inp-desc').focus();
    return;
  }
  expenses.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,5), desc, amount: amt, who: selectedWho, ts: Date.now() });
  document.getElementById('inp-desc').value = '';
  document.getElementById('inp-amt').value = '';
  document.getElementById('inp-desc').focus();
  updateOverview();
  renderList();
  saveRemote();
}

function deleteExpense(id) {
  expenses = expenses.filter(e => e.id !== id);
  updateOverview();
  renderList();
  saveRemote();
}

function setSyncState(state) {
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-label');
  const states = {
    ok:   { cls: '',        text: 'Синк' },
    busy: { cls: 'syncing', text: '...' },
    err:  { cls: 'error',   text: 'Ошибка' }
  };
  const s = states[state] || states.ok;
  dot.className = 'sync-dot ' + s.cls;
  lbl.textContent = s.text;
}

async function saveRemote() {
  setSyncState('busy');
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
    setSyncState('ok');
  } catch(e) { setSyncState('err'); }
}

async function loadRemote() {
  setSyncState('busy');
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const loaded = JSON.parse(raw);
      if (loaded.length !== expenses.length || JSON.stringify(loaded) !== JSON.stringify(expenses)) {
        expenses = loaded;
        updateOverview();
        renderList();
      }
    }
    setSyncState('ok');
  } catch(e) { setSyncState('err'); }
}

loadRemote();
syncInterval = setInterval(loadRemote, 20000);
</script>
</body>
</html>
